name: Build BANGLACLIENT JAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod JAR with Gradle
        run: gradle build -x test --no-daemon

      - name: Upload Built Mod JAR to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BANGLACLIENT-1.21.11-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish JAR to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BANGLACLIENT v1.0.${{ github.run_number }} (MC 1.21.11)
          files: |
            build/libs/banglaclient-1.0.0.jar
